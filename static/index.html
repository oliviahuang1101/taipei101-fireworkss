<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台北101｜煙火視野地圖 V3</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f9;color:#15253d;font-family:system-ui,'Microsoft JhengHei',sans-serif}header{background:#101e37;color:white;padding:16px 22px}header h1{margin:0;font-size:21px}header small{color:#bed1eb}main{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;padding:12px}.panel{background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px #18335218}.toolbar{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar strong{margin-right:auto}button,select{background:#fff;border:1px solid #cdd9e7;border-radius:8px;padding:9px;color:#19385b;cursor:pointer}.primary{background:#2164ce;color:white}#map{height:660px}.right{display:flex;flex-direction:column;gap:12px}.scene-head{padding:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.scene-head small{display:block;color:#66788c}#scene{height:360px;background:#071329;position:relative;touch-action:none}#scene canvas{display:block}.controls{display:flex;gap:6px;flex-wrap:wrap}.hint,.status,.foot{padding:10px 14px;font-size:12px;color:#596c82}.status{background:#fff5dc;color:#78561d;line-height:1.6}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}.metric{background:#f0f4fa;border-radius:8px;padding:10px}.metric small{font-size:12px;color:#66788c}.metric b{display:block;margin-top:5px}.rec{padding:15px}.rec h2{font-size:17px;margin:0 0 10px}.rec textarea{width:100%;min-height:65px;padding:10px;border:1px solid #cdd9e7;border-radius:8px;font:inherit}.result{border:1px solid #d8e2ef;border-radius:8px;margin-top:8px;padding:10px;cursor:pointer}.result:hover{background:#eef5ff}.legend{padding:10px;font-size:12px;color:#60718a}.sw{display:inline-block;width:12px;height:12px;margin-left:6px;border-radius:3px}@media(max-width:950px){main{grid-template-columns:1fr}#map{height:440px}}@media(max-width:550px){header h1{font-size:17px}#scene{height:310px}.scene-head{display:block}.controls{margin-top:10px}.toolbar{font-size:13px}}
</style></head><body>
<header><h1>台北 101｜跨年煙火視野探索 <small>V3</small></h1><small>2D 視野地圖 × 第一人稱 3D × 循環煙火 × 觀賞地點推薦</small></header>
<main><section class="panel"><div class="toolbar"><strong>觀賞位置地圖</strong><select id="mode"><option value="demo">示範建物</option><option value="osm">OpenStreetMap 建物</option></select><button class="primary" id="load">載入資料</button><label><input type="checkbox" id="grid" checked> 視野網格</label><label><input type="checkbox" id="crowd" checked> 人潮</label></div><div id="map"></div><div class="legend">視野 <span class="sw" style="background:#e0ecff"></span>低 <span class="sw" style="background:#9ac5ff"></span>中 <span class="sw" style="background:#3479d7"></span>高 <span class="sw" style="background:#173f91"></span>極高 <span class="sw" style="background:#8b97a8"></span>未知</div></section>
<div class="right"><section class="panel"><div class="scene-head"><div><b>站在這裡看台北 101</b><small id="pointname">點選地圖上的網格</small></div><div class="controls"><button id="night">白天模式</button><button id="pause">暫停煙火</button><button id="reset">重設視角</button></div></div><div id="scene"></div><div class="hint">拖曳旋轉視角 · 滾輪縮放 · 煙火自動循環。煙火施放位置與時序為示意，非真實煙火秀重現。</div><div class="metrics"><div class="metric"><small>模擬視野</small><b id="score">—</b></div><div class="metric"><small>預估人潮</small><b id="crowdval">—</b></div><div class="metric"><small>捷運步行</small><b id="walk">—</b></div></div><div class="foot"><a id="gmaps" target="_blank" rel="noopener">在 Google Maps 查看</a>　<span id="uncertain"></span></div></section>
<section class="panel rec"><h2>依照偏好推薦觀賞位置</h2><textarea id="prompt">希望視野好、人少，而且走到捷運站不要超過15分鐘</textarea><button class="primary" id="recommend">找推薦地點</button><p id="recnotice" class="hint">使用規則式推薦，非 LLM。</p><div id="results"></div></section><section class="panel status" id="status">示範模式使用合成建物、人潮及步行時間。OSM 高度可能缺漏；煙火、地形及實際視線均未校正。</section></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
const LAT=25.033968,LON=121.564468;
let dataset=null,selected=null,gridLayer=null,crowdLayer=null,recLayer=null,viewer=null,night=true,paused=false;
const $=id=>document.getElementById(id);
const map=L.map('map').setView([LAT,LON],15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);
L.marker([LAT,LON]).addTo(map).bindPopup('台北 101');
function shade(s){return s==null?'#8b97a8':s<30?'#e0ecff':s<60?'#9ac5ff':s<85?'#3479d7':'#173f91'}
function draw(){if(gridLayer)map.removeLayer(gridLayer);if(crowdLayer)map.removeLayer(crowdLayer);gridLayer=L.layerGroup();crowdLayer=L.layerGroup();const lat=50/111100,lon=lat/Math.cos(LAT*Math.PI/180);for(const c of dataset.cells){const r=L.rectangle([[c.lat-lat/2,c.lon-lon/2],[c.lat+lat/2,c.lon+lon/2]],{color:'#fff',weight:.4,fillColor:shade(c.score),fillOpacity:.67});r.bindTooltip(c.id+' · '+(c.score==null?'未知':c.score+'%'));r.on('click',()=>choose(c));r.addTo(gridLayer);if(c.crowd!=='未知'&&c.id.endsWith('05'))L.circleMarker([c.lat,c.lon],{radius:5,color:'#fff',weight:1,fillColor:({'舒適':'#43a779','稍擠':'#f4c34b','非常擠':'#db6553'}[c.crowd]||'#888'),fillOpacity:1}).on('click',()=>choose(c)).addTo(crowdLayer)}if($('grid').checked)gridLayer.addTo(map);if($('crowd').checked)crowdLayer.addTo(map)}
$('grid').onchange=()=>{if(!gridLayer)return;if($('grid').checked)gridLayer.addTo(map);else map.removeLayer(gridLayer)};
$('crowd').onchange=()=>{if(!crowdLayer)return;if($('crowd').checked)crowdLayer.addTo(map);else map.removeLayer(crowdLayer)};
function choose(c){selected=c;$('pointname').textContent=c.id+'｜'+c.lat.toFixed(5)+', '+c.lon.toFixed(5);$('score').textContent=c.score==null?'未知':c.score+'%';$('crowdval').textContent=c.crowd;$('walk').textContent=c.walk==null?'未提供':c.walk+' 分';$('uncertain').textContent=c.uncertain?'建物高度不完整':'';$('gmaps').href='https://www.google.com/maps/search/?api=1&query='+c.lat+','+c.lon;render3D(c)}
async function load(mode){$('load').disabled=true;$('status').textContent='資料載入與視野計算中…';try{const response=mode==='demo'?await fetch('/api/data'):await fetch('/api/reload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode})});const data=await response.json();if(!response.ok)throw Error(data.error||'伺服器錯誤');dataset=data;draw();choose(data.cells[Math.floor(data.cells.length/2)]);$('status').textContent=(mode==='demo'?'合成示範資料':'OSM 建物輪廓')+'｜建物 '+data.total+' 棟，缺少高度 '+data.unknown+' 棟。人潮、交通及煙火動畫未經實地校正。'}catch(e){$('status').textContent='載入失敗：'+e.message+'。可選示範建物再試。'}finally{$('load').disabled=false}}
$('load').onclick=()=>load($('mode').value);
$('recommend').onclick=async()=>{try{const r=await fetch('/api/recommend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:$('prompt').value})});const d=await r.json();if(!r.ok)throw Error('推薦失敗');$('recnotice').textContent=d.note;$('results').replaceChildren();if(recLayer)map.removeLayer(recLayer);recLayer=L.layerGroup().addTo(map);for(const [i,c] of d.items.entries()){const el=document.createElement('div');el.className='result';el.textContent=(i+1)+'. '+c.id+'｜視野 '+c.score+'%｜人潮 '+c.crowd;el.onclick=()=>{choose(c);map.flyTo([c.lat,c.lon],17)};$('results').appendChild(el);L.circleMarker([c.lat,c.lon],{radius:9,color:'#e66b23',fillColor:'#ffb366',fillOpacity:.9}).on('click',el.onclick).addTo(recLayer)}if(!d.items.length)$('results').textContent='沒有符合條件的可靠候選地點。'}catch(e){$('recnotice').textContent=e.message}};
$('night').onclick=()=>{night=!night;$('night').textContent=night?'白天模式':'夜晚模式';if(selected)render3D(selected)};
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'繼續煙火':'暫停煙火'};
function render3D(c){const el=$('scene');if(viewer){viewer.dispose();viewer=null}if(typeof THREE==='undefined'){el.textContent='3D 函式庫未載入，請檢查網路。';return}el.replaceChildren();let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:false})}catch(e){el.textContent='此裝置無法啟動 WebGL：'+e.message;return}
const w=Math.max(el.clientWidth,200),h=Math.max(el.clientHeight,200);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(w,h);el.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(night?0x071329:0xd5e8f8);scene.fog=new THREE.Fog(night?0x071329:0xd5e8f8,950,2400);
const camera=new THREE.PerspectiveCamera(68,w/h,.1,2600);camera.position.set(c.x,1.6,-c.y);
const target=new THREE.Vector3(0,240,0),look=new THREE.Vector3().subVectors(target,camera.position).normalize();let yaw=-Math.atan2(look.x,-look.z),pitch=Math.asin(look.y);function aim(){camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch}aim();
scene.add(new THREE.HemisphereLight(0xffffff,0x7a90b4,night?.65:2));const sun=new THREE.DirectionalLight(0xffffff,night?.5:1.7);sun.position.set(-180,500,250);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2200,2200),new THREE.MeshLambertMaterial({color:night?0x152536:0xc6d4c4}));ground.rotation.x=-Math.PI/2;ground.position.y=-.3;scene.add(ground);
const mat=new THREE.MeshLambertMaterial({color:night?0x4c607c:0x8799b1,side:THREE.DoubleSide});const unknownMat=new THREE.MeshLambertMaterial({color:0xa48767,transparent:true,opacity:.75,side:THREE.DoubleSide});
for(const b of dataset.buildings){if(b.points.length<3)continue;const shape=new THREE.Shape();shape.moveTo(b.points[0][0],-b.points[0][1]);for(let i=1;i<b.points.length;i++)shape.lineTo(b.points[i][0],-b.points[i][1]);shape.closePath();const geo=new THREE.ExtrudeGeometry(shape,{depth:b.height||15,bevelEnabled:false});geo.rotateX(-Math.PI/2);scene.add(new THREE.Mesh(geo,b.height==null?unknownMat:mat))}
// Schematic Taipei 101: opaque depth-writing surfaces are essential for occlusion.
const tower=new THREE.Mesh(new THREE.BoxGeometry(42,505,42),new THREE.MeshLambertMaterial({color:night?0x286b77:0x3b8c91}));tower.position.y=252.5;scene.add(tower);const spire=new THREE.Mesh(new THREE.CylinderGeometry(1.5,3,45,8),new THREE.MeshBasicMaterial({color:0xff6558}));spire.position.y=527;scene.add(spire);
const heights=[120,165,210,255,300,345,390,435,480];const colors=[0xffd66e,0xff688b,0x7bdcff,0xbca2ff,0x7cf4bd,0xffffff];const sparks=[];const geo=new THREE.SphereGeometry(1,5,4);const materials=colors.map(color=>new THREE.MeshBasicMaterial({color,transparent:false,depthTest:true,depthWrite:true}));for(let i=0;i<180;i++){const mesh=new THREE.Mesh(geo,materials[i%materials.length]);mesh.visible=false;scene.add(mesh);sparks.push({mesh,life:0,ttl:1,origin:new THREE.Vector3(),vx:0,vy:0,vz:0})}
let elapsed=0,cycle=0,previous=performance.now(),frame=0,disposed=false;
function burst(k){const height=heights[(k*5)%heights.length],side=k%4,angle=side*Math.PI/2,ox=Math.cos(angle)*27,oz=Math.sin(angle)*27,count=20,base=(k*count)%sparks.length;for(let j=0;j<count;j++){const p=sparks[(base+j)%sparks.length],a=j*2.39996+k*.6,radial=.65+((j*7)%11)/16,v=10+((j*13+k)%17);p.origin.set(ox,height,oz);p.mesh.position.copy(p.origin);p.vx=Math.cos(a)*v*radial+Math.cos(angle)*9;p.vy=Math.sin(a)*v*.78+7;p.vz=Math.sin(a*1.67)*v*radial+Math.sin(angle)*9;p.ttl=1.1+(j%5)*.13;p.life=p.ttl;p.mesh.visible=true}}
function animate(now){if(disposed)return;frame=requestAnimationFrame(animate);const dt=Math.min((now-previous)/1000,.06);previous=now;if(!paused){elapsed+=dt;const next=Math.floor(elapsed*3);if(next!==cycle){cycle=next;burst(cycle)}for(const p of sparks){if(p.life<=0)continue;p.life-=dt;if(p.life<=0){p.mesh.visible=false;continue}const age=p.ttl-p.life;p.mesh.position.set(p.origin.x+p.vx*age,p.origin.y+p.vy*age-13*age*age,p.origin.z+p.vz*age);p.mesh.scale.setScalar((.8+1.1*p.life/p.ttl)*1.5)}}renderer.render(scene,camera)}frame=requestAnimationFrame(animate);
const canvas=renderer.domElement;let dragging=false,lx=0,ly=0;canvas.style.cursor='grab';canvas.onpointerdown=e=>{dragging=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>dragging=false;canvas.onpointercancel=()=>dragging=false;canvas.onpointermove=e=>{if(!dragging)return;yaw-=(e.clientX-lx)*.004;pitch=Math.max(-1.35,Math.min(1.35,pitch-(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY;aim()};canvas.onwheel=e=>{e.preventDefault();camera.fov=Math.max(25,Math.min(95,camera.fov+Math.sign(e.deltaY)*3));camera.updateProjectionMatrix()};$('reset').onclick=()=>{yaw=-Math.atan2(look.x,-look.z);pitch=Math.asin(look.y);camera.fov=68;camera.updateProjectionMatrix();aim()};
viewer={dispose(){disposed=true;cancelAnimationFrame(frame);scene.traverse(o=>{if(o.geometry)o.geometry.dispose()});for(const m of [mat,unknownMat,...materials])m.dispose();renderer.dispose();el.replaceChildren()}}}
load('demo');
</script></body></html>
